{{define "cards/manager_version_status.html"}}
<div id="manager-card-versions"
    class="card glass-card versions-card"
    data-card-id="manager-version-status"
    data-manager-section
    data-section-title="Software Versions"
    hx-get="/manager/cards/manager-version-status"
    hx-trigger="sdsm:card-refresh[event.detail.cardId == 'manager-version-status'] from:body"
    hx-target="this"
    hx-swap="outerHTML">
    <details class="card-collapse" data-collapse-id="manager-version-status" open>
        <summary class="card-collapse-summary">
            <div data-card-drag-handle class="card-drag-handle" title="Drag to reorder" aria-label="Drag to reorder"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="13" r="1.5"/><circle cx="11" cy="13" r="1.5"/></svg></div>
            <div class="card-header-text">
                <h2 class="card-title">Software Versions</h2>
                <p class="card-subtitle">Track release channels and apply updates without leaving the manager.</p>
            </div>
            <span class="collapse-chevron" data-collapse-icon>
                <i data-feather="chevron-down" aria-hidden="true"></i>
            </span>
        </summary>
        <div class="card-collapse-body">
            <div class="card-actions">
                <button class="btn btn-ghost" type="button"
                        hx-get="/api/manager/versions"
                        hx-target="#version-status-grid"
                        hx-swap="innerHTML"
                        title="Refresh software versions">
                    <i data-feather="refresh-cw"></i>
                    <span>Refresh</span>
                </button>
            </div>
    <div class="card-body versions-card-body">
        <div id="version-status-grid"
             class="versions-grid"
             hx-get="/api/manager/versions"
               hx-trigger="load, sdsm:refresh-versions from:body"
             hx-target="#version-status-grid"
             hx-swap="innerHTML">
            <div class="versions-loading">
                <div class="spinner" aria-hidden="true"></div>
                <span>Loading component versions…</span>
            </div>
        </div>
        </div>
    </details>
</div>
{{end}}
