{{define "cards/manager_logs.html"}}
<div id="manager-card-logs"
    class="glass-card manager-logs-card col-span-full"
    data-card-id="manager-logs"
    data-card-lazy="true"
    data-log-viewer
    data-log-base-url="/api/manager"
    data-manager-section
    data-section-title="Logs"
    hx-get="/manager/cards/manager-logs"
    hx-trigger="sdsm:card-refresh[event.detail.cardId == 'manager-logs'] from:body"
    hx-target="this"
    hx-swap="outerHTML">
    <details class="card-collapse" data-collapse-id="manager-logs" open>
        <summary class="card-collapse-summary">
            <div data-card-drag-handle class="card-drag-handle" title="Drag to reorder" aria-label="Drag to reorder"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="13" r="1.5"/><circle cx="11" cy="13" r="1.5"/></svg></div>
            <div class="card-header-text">
                <h2 class="card-title">Logs</h2>
                <p class="card-subtitle">Tail manager log files without leaving this page.</p>
            </div>
            <span class="collapse-chevron" data-collapse-icon>
                <i data-feather="chevron-down" aria-hidden="true"></i>
            </span>
        </summary>
        <div class="card-collapse-body">
            <div class="card-actions">
                <div class="btn-group">
                    <button type="button" class="btn btn-sm btn-secondary" data-log-refresh>
                        <i data-feather="refresh-cw" aria-hidden="true"></i>
                        <span>Refresh</span>
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" data-log-download>
                        <i data-feather="download" aria-hidden="true"></i>
                        <span>Download</span>
                    </button>
                    {{if eq .role "admin"}}
                    <button type="button" class="btn btn-sm btn-danger" data-log-clear>
                        <i data-feather="trash-2" aria-hidden="true"></i>
                        <span>Clear</span>
                    </button>
                    {{end}}
                </div>
            </div>
            <div class="tabs" role="tablist" aria-label="Log files" data-log-tabs>
                <div class="empty-state" data-log-empty>Loading log list…</div>
            </div>
            <div class="log-viewer" data-log-view aria-live="polite" aria-label="Log output">
                <div class="empty-state">Select a log to stream its output.</div>
            </div>
            <div class="log-status" data-log-status></div>
        </div>
    </details>
</div>
{{end}}
